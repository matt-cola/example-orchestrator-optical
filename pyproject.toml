[project]
name = "example-orchestrator-optical"
version = "0.1.0"
# Python version should match https://github.com/workfloworchestrator/orchestrator-core/blob/main/Dockerfile
requires-python = "==3.13.*"
dependencies = [
  "orchestrator-core==5.6.0",
  "orchestrator-shell>=2.1.0",
  # Confidential vendor SDK, not distributed with orchestrator-optical (see its README, "Vendor SDKs")
  "g30_4_8_0",
  "g42_8_0_2",
  "flexils_tl1",
]

[tool.uv.sources]
g30_4_8_0 = { path = "vendor/g30_4_8_0", editable = true }
g42_8_0_2 = { path = "vendor/g42_8_0_2", editable = true }
flexils_tl1 = { path = "vendor/flexils_tl1", editable = true }

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["db", "products", "workflows"]
