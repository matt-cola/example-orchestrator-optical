[project]
name = "example-orchestrator-optical"
version = "0.1.0"
# Python version should match https://github.com/workfloworchestrator/orchestrator-core/blob/main/Dockerfile
requires-python = "==3.13.*"
dependencies = [
  "orchestrator-core==5.1.3",
  "orchestrator-shell>=2.1.0",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["db", "device_stubs", "products", "workflows"]
