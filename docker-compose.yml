# Example stack to test the orchestrator-optical module end to end through the
# real orchestrator-core process engine and the orchestrator UI.
#
# Services: postgres (pgvector), redis, orchestrator (core backend) and
# orchestrator-ui. The orchestrator-optical module under test is mounted into
# the orchestrator container and installed editable, so module edits
# hot-reload.
#
# Published ports bind to the host loopback by default; widen them
# deliberately via BIND_ADDRESS_<SERVICE> variables if needed.

services:
  postgres:
    container_name: postgres
    # pgvector is required by the orchestrator-core migration head
    image: pgvector/pgvector:pg17
    ports:
      - "${BIND_ADDRESS_POSTGRES:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: nwa
      POSTGRES_PASSWORD: nwa
      POSTGRES_DB: orchestrator-core
    volumes:
      - db-data:/var/lib/postgresql/data/
      - ./docker/postgresql:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "--username",
          "nwa",
          "--dbname",
          "orchestrator-core",
        ]
      interval: "3s"
      timeout: "2s"
      retries: 20
      start_period: "5s"

  redis:
    container_name: redis
    image: docker.io/redis:8-alpine
    command:
      - sh
      - -c
      - redis-server --requirepass $$REDIS_PASSWORD
    environment:
      REDIS_PASSWORD: nwa
    healthcheck:
      test: '[ $$(redis-cli --pass "$${REDIS_PASSWORD}" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5

  orchestrator:
    container_name: orchestrator
    # Keep this tag in sync with the orchestrator-core pin in pyproject.toml
    # (and with the orchestrator-optical module's uv.lock): the image ships a
    # preinstalled venv, and running `db upgrade heads` with a different core
    # version than the one the database was migrated with breaks the alembic
    # revision chain.
    image: ${ORCH_BACKEND_TAG:-ghcr.io/workfloworchestrator/orchestrator-core:5.1.3}
    env_file:
      - ./docker/orchestrator/orchestrator.env
      - path: ./docker/overrides/orchestrator.env
        required: false
    ports:
      - "${BIND_ADDRESS_ORCHESTRATOR:-127.0.0.1}:8080:8080"
      - "${BIND_ADDRESS_ORCHESTRATOR_DEBUGPY:-127.0.0.1}:5678:5678" # Python debugger
    volumes:
      - ./alembic.ini:/home/orchestrator/alembic.ini
      - ./main.py:/home/orchestrator/main.py
      - ./wsgi.py:/home/orchestrator/wsgi.py
      - ./db.py:/home/orchestrator/db.py
      - ./device_stubs.py:/home/orchestrator/device_stubs.py
      - ./pyproject.toml:/home/orchestrator/pyproject.toml
      - ./uv.lock:/home/orchestrator/uv.lock
      - ./migrations:/home/orchestrator/migrations
      - ./products:/home/orchestrator/products
      - ./workflows:/home/orchestrator/workflows
      - ./translations:/home/orchestrator/translations
      - ./docker:/home/orchestrator/etc
      # The module under test, installed editable by the entrypoint
      - ${OPTICAL_MODULE_DIR:-../orchestrator-optical}:/home/orchestrator/orchestrator-optical
    entrypoint: ["/home/orchestrator/etc/orchestrator/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      start_period: 15s
      timeout: 5s
      interval: 5s
      retries: 20
      test: /home/orchestrator/etc/orchestrator/is_healthy.py

  orchestrator-ui:
    container_name: orchestrator-ui
    image: ${ORCH_UI_TAG:-ghcr.io/workfloworchestrator/example-orchestrator-ui:latest}
    env_file:
      - ./docker/orchestrator-ui/orchestrator-ui.env
      - path: ./docker/overrides/orchestrator-ui/orchestrator-ui.env
        required: false
    ports:
      - "${BIND_ADDRESS_ORCHESTRATOR_UI:-127.0.0.1}:3000:3000"
    depends_on:
      orchestrator:
        condition: service_started

volumes:
  db-data:
    driver: local
